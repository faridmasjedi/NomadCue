name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Syntax check
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done
      - run: npm test

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install virtual display & audio
        run: sudo apt-get update && sudo apt-get install -y xvfb pulseaudio
      - name: Run app self-test
        run: |
          pulseaudio --start --exit-idle-time=-1 || true
          xvfb-run -a npm run smoke -- --no-sandbox

  package:
    name: Package (Linux dir build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --linux dir --publish never
