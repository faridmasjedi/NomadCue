<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: media: blob: data: mediastream:; style-src 'self' 'unsafe-inline' file:">
  <title>NomadCue Stage</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
    #surface { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; overflow: hidden; isolation: isolate; }
    .layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; will-change: opacity, transform; }
    .layer > video, .layer > img { width: 100%; height: 100%; }
    .layer > .text { white-space: pre-wrap; padding: 2%; line-height: 1.15; }
    .blend { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 99999; }
    #ident { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
      color: #fff; font: 600 4vw system-ui, sans-serif; z-index: 100000;
      background: repeating-linear-gradient(45deg, #222 0 40px, #2c2c2c 40px 80px); border: 6px solid #f5a623; box-sizing: border-box; }
    #ident small { font-size: 1.6vw; opacity: .7; margin-top: 1vw; }
  </style>
</head>
<body>
  <div id="surface"></div>
  <div id="ident"><span id="identName"></span><small id="identSize"></small></div>
  <script type="module" src="stage.js"></script>
</body>
</html>
